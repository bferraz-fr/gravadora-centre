<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravadora · La meva veu</title>
<style>body{font:16px system-ui,sans-serif;background:#f4f7fb;color:#183153;margin:0;padding:16px}.card{max-width:560px;margin:6vh auto;background:white;padding:28px;border-radius:20px;box-shadow:0 10px 35px #1232}button{font:inherit;padding:12px 16px;margin:4px;border:0;border-radius:10px;background:#205a83;color:#fff;cursor:pointer}button:disabled{opacity:.4}audio{width:100%;margin:20px 0}#status{min-height:2em}small{color:#52657a}</style>
</head><body><main class="card"><h1>🎙️ La meva veu</h1><p>Prem «Començar», parla i després «Aturar». Pots escoltar o repetir abans d'enviar.</p><button id="start">⏺ Començar</button><button id="stop" disabled>⏹ Aturar</button><button id="reset" disabled>↻ Repetir</button><p id="clock">00:00 / 02:00</p><audio id="player" controls></audio><p><button id="send" disabled>Enviar al professorat</button></p><p id="status" role="status" aria-live="polite"></p><small>La gravació només s'envia quan prems «Enviar».</small></main>
<script>
const token = new URLSearchParams(location.search).get('token');
let rec, stream, chunks=[], blob=null, timer=null, seconds=0, url=null, mime='';
const $=id=>document.getElementById(id), status=$('status');
const resetUI=()=>{blob=null;chunks=[];if(url)URL.revokeObjectURL(url);url=null;$('player').removeAttribute('src');$('player').load();$('send').disabled=true;$('reset').disabled=true;};
$('start').onclick=async()=>{
 if(!token||!window.opener){status.textContent='Obre aquesta gravadora des de l’aplicació del centre.';return;}
 if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){status.textContent='Aquest navegador no permet gravar àudio.';return;}
 try{
  resetUI();stream=await navigator.mediaDevices.getUserMedia({audio:true});
  mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime)throw Error('Format no compatible');
  rec=new MediaRecorder(stream,{mimeType:mime});
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{clearInterval(timer);stream.getTracks().forEach(t=>t.stop());blob=new Blob(chunks,{type:rec.mimeType});if(blob.size>4500000){status.textContent='Àudio massa gran; prova amb una gravació més curta.';resetUI();return}url=URL.createObjectURL(blob);$('player').src=url;$('send').disabled=false;$('reset').disabled=false;$('start').disabled=false;status.textContent='Escolta la gravació. Si està bé, prem «Enviar».';};
  rec.start(1000);seconds=0;$('clock').textContent='00:00 / 02:00';$('start').disabled=true;$('stop').disabled=false;status.textContent='Enregistrant…';
  timer=setInterval(()=>{seconds++;$('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')+' / 02:00';if(seconds>=120)$('stop').click()},1000);
 }catch(e){stream?.getTracks().forEach(t=>t.stop());status.textContent='No s’ha pogut activar el micròfon: '+e.message}
};
$('stop').onclick=()=>{if(rec?.state==='recording'){rec.stop();$('stop').disabled=true;status.textContent='Preparant l’àudio…'}};
$('reset').onclick=()=>{resetUI();status.textContent='Pots tornar a gravar.'};
$('send').onclick=()=>{
 if(!blob || !window.opener || !token)return;
 $('send').disabled=true;status.textContent='Transferint la gravació per guardar-la…';
 const reader=new FileReader();
 reader.onload=()=>{
  const base64=String(reader.result).split(',')[1];
  window.opener.postMessage({type:'audio-ready',token,mime:blob.type.split(';')[0],base64},'*');
  status.textContent='Enviament iniciat. Consulta la finestra principal per confirmar que s’ha desat.';
 };
 reader.onerror=()=>{status.textContent='Error llegint l’àudio.';$('send').disabled=false};
 reader.readAsDataURL(blob);
};
window.addEventListener('message',e=>{if(e.source!==window.opener)return; if(e.data?.type==='saved'){status.textContent='✅ Gravació desada correctament al Drive del professorat.';blob=null;} if(e.data?.type==='retry' && blob){$('send').disabled=false;status.textContent='L’enviament ha fallat. Pots tornar-ho a provar.';}});
</script></body></html>
